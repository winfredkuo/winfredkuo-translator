<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>翻譯工具 - 繁中 / 英文 / 日文</title>
    <meta name="theme-color" content="#07111f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/translator.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Instant Translation</p>
          <h1>繁中、英文、日文即時互譯</h1>
          <p class="lead">
            支援繁體中文、英文、日文互譯。可直接輸入文字或使用語音，翻譯結果會即時顯示並可播放。
          </p>
        </div>

        <div class="control-grid">
          <label class="field">
            <span>語言方向</span>
            <select id="directionSelect">
              <option value="zh-en">繁中 → 英文</option>
              <option value="zh-ja">繁中 → 日文</option>
              <option value="en-zh">英文 → 繁中</option>
              <option value="ja-zh">日文 → 繁中</option>
              <option value="auto-zh">自動辨識 → 繁中</option>
            </select>
          </label>

          <label class="field">
            <span>輸入內容</span>
            <textarea id="inputText" rows="4" placeholder="可直接輸入，或按麥克風開始說話。"></textarea>
          </label>

          <div class="action-row">
            <button id="micButton" class="primary-btn" type="button">
              <span class="mic-dot"></span>
              語音輸入
            </button>
            <button id="translateButton" class="secondary-btn" type="button">翻譯</button>
          </div>

          <div class="status-bar">
            <span id="statusText">準備好了。</span>
            <span id="voiceStatus" class="voice-status">可用</span>
          </div>
        </div>
      </section>

      <section class="result-grid">
        <article class="result-card source-card">
          <div class="card-head">
            <h2>原文</h2>
            <button id="copySourceBtn" class="ghost-btn" type="button">複製</button>
          </div>
          <div id="sourcePreview" class="result-text muted">輸入的內容會顯示在這裡。</div>
        </article>

        <article class="result-card target-card">
          <div class="card-head">
            <h2>結果</h2>
            <div class="card-actions">
              <button id="speakButton" class="ghost-btn" type="button" disabled>朗讀</button>
              <button id="copyTargetBtn" class="ghost-btn" type="button" disabled>複製</button>
              <button id="fullscreenButton" class="ghost-btn" type="button" disabled>全畫面</button>
            </div>
          </div>
          <div id="targetPreview" class="result-text muted">翻譯結果會顯示在這裡。</div>
        </article>
      </section>

      <section class="hint-card">
        <div>
          <h3>使用方式</h3>
          <p>選好語言方向後，直接輸入文字或按下語音輸入。翻譯完成後可立即朗讀給對方聽。</p>
        </div>
        <div class="hint-list">
          <span>文字輸入</span>
          <span>語音翻譯</span>
          <span>即時播放</span>
        </div>
      </section>

      <div id="presentationOverlay" class="presentation-overlay" aria-hidden="true">
        <div class="presentation-shell">
          <div class="presentation-top">
            <span id="presentationDirection" class="presentation-badge">展示模式</span>
            <button id="closePresentationButton" class="ghost-btn" type="button">關閉</button>
          </div>
          <div class="presentation-copy">
            <p id="presentationSource" class="presentation-source">原文會顯示在這裡。</p>
            <h2 id="presentationTarget" class="presentation-target">翻譯結果會顯示在這裡。</h2>
          </div>
          <p class="presentation-hint">可直接把手機遞給對方查看。</p>
        </div>
      </div>
    </main>

    <script>
      const templateApiBase = "{{ translator_api_base_url }}";
      window.TRANSLATOR_API_BASE_URL =
        templateApiBase && !templateApiBase.includes("{")
          ? templateApiBase
          : "https://winfredkuo-translator.theoder.workers.dev";
    </script>
    <script src="../static/translator.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/static/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
